scope:"范围：Ch7 周期性规律（7.2–7.6）+ Ch8 Lewis 结构（8.1–8.5, 8.8）。Mid-term Review 里混了 Ch6 电子排布和 Ch2 命名，当保分题。Ch9 VSEPR 不是重点。建议顺序：错题 → Ch7 答题模板 → Ch8 → Ch6/Ch2。",
mistakes:`
<div>
<h3>Mid-term Review 选择题（44/50）</h3>
<p class="scope" style="margin:0 0 10px">错的几乎全是 Ch8 概念题。规律：遇到 polar / nonpolar、δ⁻、formal charge，<mark>先写出电负性数值再选</mark>；题干出现 reverse / per mole of X 时圈出来。红色 = 你选的，绿色 = 正确答案。</p>
<div class="qlist">
<div class="q no"><div class="num">4</div><div class="stem">Which of the following bonds would be considered <b>non-polar covalent</b>?</div>
<div class="opts"><div class="opt"><span class="let">A</span><span>N–H</span></div><div class="opt right"><span class="let">B</span><span>C–H</span></div><div class="opt wrong"><span class="let">C</span><span>O–H</span></div><div class="opt"><span class="let">D</span><span>C–Cl</span></div><div class="opt"><span class="let">E</span><span>C–O</span></div></div>
<div class="ans">ΔEN：N–H 0.9，<b>C–H 0.4</b>，O–H 1.4，C–Cl 0.5，C–O 1.0。C–H 最小，算 nonpolar。O–H 是这几个里<b>最极性</b>的，正好选反了。</div></div>

<div class="q no"><div class="num">13</div><div class="stem">Why don't we draw double bonds between the Be atom and the Cl atoms in BeCl₂?</div>
<div class="opts" style="grid-template-columns:1fr">
<div class="opt right"><span class="let">A</span><span>That would give positive formal charges to the chlorine atoms and a negative formal charge to the beryllium atom.</span></div>
<div class="opt wrong"><span class="let">B</span><span>There aren't enough electrons.</span></div>
<div class="opt"><span class="let">C</span><span>That would result in more than eight electrons around beryllium.</span></div>
<div class="opt"><span class="let">D</span><span>That would result in more than eight electrons around each chlorine atom.</span></div>
<div class="opt"><span class="let">E</span><span>That would result in the formal charges not adding up to zero.</span></div></div>
<div class="ans">电子够用：2 + 7 × 2 = 16 e⁻。画成 Cl=Be=Cl 后 Cl 带 +1、Be 带 −2，负电荷落在电负性小的 Be 上，不合理。C 也不对：两个双键时 Be 周围正好 8 个电子，不超过。</div></div>

<div class="q no"><div class="num">22</div><div class="stem">In the molecule below, which atom has the <b>largest partial negative charge</b>?
<pre class="m" style="display:inline-block;line-height:1.3;margin:6px 0;padding:6px 12px">     Cl
     |
F —  C — Br
     |
     I</pre></div>
<div class="opts"><div class="opt"><span class="let">A</span><span>Cl</span></div><div class="opt right"><span class="let">B</span><span>F</span></div><div class="opt"><span class="let">C</span><span>Br</span></div><div class="opt wrong"><span class="let">D</span><span>I</span></div><div class="opt"><span class="let">E</span><span>C</span></div></div>
<div class="ans">δ⁻ 看电负性：F 4.0 &gt; Cl 3.0 &gt; Br 2.8 &gt; I 2.5（≈ C 2.5）。I 是卤素里最<b>小</b>的，几乎不带 δ⁻。</div></div>

<div class="q no"><div class="num">26</div><div class="stem">A nonpolar bond will form between two ______ atoms of ______ electronegativity.</div>
<div class="opts"><div class="opt"><span class="let">A</span><span>different, opposite</span></div><div class="opt"><span class="let">B</span><span>identical, different</span></div><div class="opt wrong"><span class="let">C</span><span>different, different</span></div><div class="opt"><span class="let">D</span><span>similar, different</span></div><div class="opt right"><span class="let">E</span><span>identical, equal</span></div></div>
<div class="ans">nonpolar = ΔEN = 0 → 两个相同原子、电负性相等，电子均匀共享（如 H–H、Cl–Cl）。“different, different” 描述的是 polar bond。</div></div>

<div class="q no"><div class="num">35</div><div class="stem">Using the table of bond dissociation energies, the ΔH for the <mark>reverse</mark> of the following gas-phase reaction is ______ kJ.
<div class="eq">H₂C=CH₂ + H–Br → H₃C–CH₂Br</div>
<div class="chips"><span class="chip">C–C 348</span><span class="chip">C=C 614</span><span class="chip">C–H 413</span><span class="chip">H–Br 366</span><span class="chip">C–Br 276</span></div></div>
<div class="opts"><div class="opt right"><span class="let">A</span><span>+57</span></div><div class="opt"><span class="let">B</span><span>+291</span></div><div class="opt"><span class="let">C</span><span>2017</span></div><div class="opt wrong"><span class="let">D</span><span>−57</span></div><div class="opt"><span class="let">E</span><span>−291</span></div></div>

<details open><summary>Ch7 周期性规律：老师的答题模板</summary><div class="body">
<p class="note">每个解释题只用三种理由之一：<b>shells</b>（电子层数 n）、<b>Zeff = Z − S</b>、<b>stability</b>（轨道稳定性）。先判断用哪种，再写完整因果链：理由 → attraction 变化 → R / IE 变化。</p>
<h4>半径 Radius</h4>
<div class="tbl"><table>
<tr><th>情形</th><th>理由</th><th>标准答句</th></tr>
<tr><td>同周期 左 → 右</td><td class="why">Zeff</td><td>Same n, S barely changes, Z increases → Zeff increases → stronger attraction → R decreases</td></tr>
<tr><td>同族 上 → 下</td><td class="why">shells</td><td>n increases → valence shell farther from nucleus → weaker attraction → R increases</td></tr>
<tr><td>等电子体</td><td class="why">Zeff</td><td>Same electrons so S same, Z increases → Zeff increases → R decreases<br><span class="m">N³⁻ &gt; O²⁻ &gt; F⁻ &gt; Ne &gt; Na⁺ &gt; Mg²⁺ &gt; Al³⁺</span></td></tr>
<tr><td>阳离子 vs 原子</td><td class="why">shells + Zeff</td><td>失去整个价层 → 少一层；且 Z 不变、S 减小 → Zeff 增大 → cation 更小</td></tr>
<tr><td>阴离子 vs 原子</td><td class="why">Zeff</td><td>Z 不变、加电子使 S 增大 → Zeff 减小 → anion 更大</td></tr>
</table></div>
<p style="margin-top:8px">同元素不同电荷：Fe &gt; Fe²⁺ &gt; Fe³⁺；Pb &gt; Pb²⁺ &gt; Pb⁴⁺。正电荷越高越小。</p>
<h4>电离能 Ionization Energy</h4>
<div class="tbl"><table>
<tr><th>问题</th><th>理由</th><th>标准答句</th></tr>
<tr><td>同周期 IE₁ 增大</td><td class="why">Zeff</td><td>Zeff increases → harder to ionize → IE increases</td></tr>
<tr><td>同族 IE₁ 减小</td><td class="why">shells</td><td>n increases → farther, weaker attraction → easier to ionize</td></tr>
<tr><td>IE₁ &lt; IE₂ &lt; IE₃</td><td class="why">Zeff</td><td>Z 不变，每失一个电子 S 减小（e⁻–e⁻ repulsion 减小）→ Zeff 增大；离子越来越正</td></tr>
<tr><td>价电子 IE ≪ 内层 IE（突跃）</td><td class="why">stability</td><td>开始移去 core electron，内层更靠核、更稳定 → 能量急剧上升。<mark>突跃前移去几个 = 价电子数</mark></td></tr>
<tr><td>IE(3A) &lt; IE(2A)，Al &lt; Mg</td><td class="why">stability</td><td>ns²np¹ 不如 ns² 稳定，np¹ 电子能量更高、更易失去</td></tr>
<tr><td>IE(6A) &lt; IE(5A)，O &lt; N</td><td class="why">stability</td><td>ns²np³ 半满更稳定；np⁴ 有一对成对电子，排斥使其中一个更易失去</td></tr>
</table></div>
<ul style="margin-top:8px">
<li>Al 逐级电离：IE₁→IE₃ 稳步增大，IE₃→IE₄ 突跃（第 4 个是 2p core electron）。第 4 电离方程 <span class="m">Al³⁺(g) → Al⁴⁺(g) + e⁻</span>，一定标 (g)。</li>
<li>第二电离能最大的是碱金属（Na 的第 2 个就是 core electron），题 47。</li>

<h4>其他趋势</h4>
<ul>
<li><b>Electron affinity</b>：右上更负（更放热），卤素最负；稀有气体、Group 2、N 例外。</li>
<li><b>Electronegativity</b>：左→右增大、上→下减小，F 最大（题 25）。</li>
<li><b>Metallic character</b>：左下最强（Cs）。金属性差别最小 = 位置最近，如 Na 和 Mg。</li>

<details open><summary>Ch8 离子键、键极性</summary><div class="body">

<p>定义：把 1 mol 离子固体完全分离成气态离子所需能量，正值。<span class="m">NaCl(s) → Na⁺(g) + Cl⁻(g)　ΔH = +788 kJ/mol</span></p>

<details open><summary>Ch8 Lewis 结构、形式电荷、共振</summary><div class="body">
<p class="note">老师的 “BEST Lewis structure” = <b>形式电荷最小</b>的结构；第 3 周期及以后的中心原子允许 expanded octet。题干写 “without violating the octet rule” 时才强制八隅。</p>
<h4>画法（老师 Method II）</h4>
<ol>
<li>数总价电子：负电荷加、正电荷减。</li>
<li>用单键连出 ABₙ 骨架（H 和 F 永远在端点，电负性小的当中心）。</li>
<li>剩余电子先给周围原子 B 满八隅。</li>
<li>还有剩的放中心原子 A。</li>
<li>A 不满八隅 → 把 B 的孤对移成 π 键；等价位置都能移 → 画 resonance。</li>

<h4>常考电子数</h4>
<div class="chips"><span class="chip">NO₂⁻ 18</span><span class="chip">NO⁻ 12</span><span class="chip">NO₃⁻ 24</span><span class="chip">CO₃²⁻ 24</span><span class="chip">SO₄²⁻ 32</span><span class="chip">PO₄³⁻ 32</span><span class="chip">CH₃Cl 14</span></div>
<h4>形式电荷</h4>
<div class="eq">FC = V − N(nonbonding) − ½·B(bonding)</div>
<p>最佳结构：① 各原子 FC 最接近 0；② 负 FC 落在电负性大的原子上。例 NCS⁻：<span class="m">[N=C=S]⁻</span>（−1, 0, 0）最佳。</p>
<p>NO₃⁻ 中 N 的 FC = +1；两个 S=O 的 SO₄²⁻ 中 S 的 FC = 0。</p>
<h4>Resonance</h4>
<ul>
<li>共振式之间只移动电子，不移动原子；差别是 electron placement。</li>
<li>真实结构是 hybrid：SO₂ 每根键 1.5 级，SO₃ / CO₃²⁻ 每根 1.33 级，键长相等。</li>
<li>两个等价共振：NO₂⁻、O₃、SO₂。三个：NO₃⁻、CO₃²⁻、SO₃；按 FC 最小画法，SO₃²⁻ 和 BrO₃⁻ 也是三个（题 10）。</li>

<h4>八隅例外</h4>
<div class="tbl"><table>
<tr><th>类型</th><th>例子</th></tr>
<tr><td>不足八隅</td><td>Be（BeCl₂，4 e⁻）、B（BF₃、BH₃，6 e⁻）</td></tr>
<tr><td>奇数电子</td><td>NO、NO₂</td></tr>
<tr><td>超八隅</td><td>只有第 3 周期及以后的中心原子：PCl₅、SF₄、ICl₅、XeF₄、ICl₄⁻。CF₄ 不违反八隅</td></tr>
</table></div>
</div></details>

<details open><summary>Ch8 键级、键长、键能</summary><div class="body">
<ul>
<li>键级越高 → 键越短、越强：N–N 147 pm &gt; N=N 124 pm &gt; N≡N 110 pm。</li>

<p><b>例（题 34）</b>　HC≡CH + 2HI → CH₂I–CH₂I<br>
断：C≡C 839 + 2 × H–I 299 = 1437<br>

ref:R`
<details open><summary>1 · Limits 极限</summary><div class="body">
<p>求法顺序：直接代入 → 得 \(\frac00\) 就因式分解约分 / 有理化 / 特殊极限 → 讨论单侧极限。</p>
<ul>
<li>\(\lim_{x\to a}f(x)=L\iff\) 左右极限都等于 \(L\)</li>
<li>特殊极限：\(\lim_{x\to0}\frac{\sin x}{x}=1\)，\(\lim_{x\to0}\frac{1-\cos x}{x}=0\)，\(\lim_{x\to0}\frac{\sin ax}{bx}=\frac ab\)，\(\lim_{x\to0}\frac{\tan ax}{x}=a\)</li>
<li>\(x\to\pm\infty\) 有理函数：分子次数小 ⇒ 0；相等 ⇒ 首项系数比；分子大 ⇒ \(\pm\infty\)</li>
<li>绝对值：\(\lim_{x\to a^-}\frac{|x-a|}{x-a}=-1\)，右侧 \(=1\)，双侧不存在</li>
<li>Squeeze：\(g\le f\le h\) 且 \(\lim g=\lim h=L\Rightarrow\lim f=L\)（例 \(x^2\sin\frac1x\to0\)）</li>
</ul></div></details>
<details open><summary>2 · Continuity 连续性</summary><div class="body">
<ul>
<li>间断类型：<b>removable</b>（极限存在，但 \(\ne f(a)\) 或无定义）；<b>jump</b>（左右极限不等）；<b>infinite</b>（垂直渐近线）</li>
<li>分段函数求参数：左式在分界点的值 = 右式在分界点的值</li>
<li>IVT：\(f\) 在 \([a,b]\) 连续，\(k\) 介于 \(f(a),f(b)\) 之间 ⇒ \(\exists c\in(a,b),\ f(c)=k\)</li>
</ul></div></details>
<details open><summary>3 · Differentiability 可导性</summary><div class="body">
<ul>
<li>可导 ⇒ 连续，反之不成立。</li>
<li>不可导四种：corner（\(|x|\)）、cusp（\(x^{2/3}\)）、vertical tangent（\(\sqrt[3]x\)）、discontinuity</li>
<li>分段函数可导求参数：<mark>值相等 + 导数相等</mark>两个方程</li>
</ul></div></details>
<details open><summary>4 · 导数定义</summary><div class="body">
<div class="eq">\(f'(a)=\lim_{h\to0}\dfrac{f(a+h)-f(a)}{h}=\lim_{x\to a}\dfrac{f(x)-f(a)}{x-a}\)</div>
<p>认出「伪装」的导数：</p>
<ul>
<li>\(\lim_{h\to0}\frac{(2+h)^5-32}{h}=\frac{d}{dx}x^5\big|_{x=2}=80\)</li>
<li>\(\lim_{h\to0}\frac{\sin(\frac\pi6+h)-\frac12}{h}=\cos\frac\pi6=\frac{\sqrt3}2\)</li>
<li>\(\lim_{x\to1}\frac{\ln x}{x-1}=(\ln x)'|_{x=1}=1\)</li>
</ul>
<p>用定义求导：根号乘共轭；分式通分；多项式展开后约掉 \(h\)。表格估计 \(f'(c)\approx\frac{f(b)-f(a)}{b-a}\)，取最近两点，写出算式，带单位。</p>
</div></details>
<details open><summary>5 · 求导法则</summary><div class="body">
<div class="tbl"><table>
<tr><th>法则</th><th>公式</th></tr>
<tr><td>Power</td><td>\((x^n)'=nx^{n-1}\)　先把 \(\sqrt x,\ \frac1{x^2}\) 改写成 \(x^{1/2},\ x^{-2}\)</td></tr>
<tr><td>Product</td><td>\((uv)'=u'v+uv'\)</td></tr>
<tr><td>Quotient</td><td>\(\left(\frac uv\right)'=\frac{u'v-uv'}{v^2}\)</td></tr>
<tr><td>Chain</td><td>\([f(g(x))]'=f'(g(x))\cdot g'(x)\)　外层求导，里面不动，再乘里层导数</td></tr>
</table></div>
<p style="margin-top:8px">常见形式：\((u^n)'=nu^{n-1}u'\)，\((e^u)'=e^uu'\)，\((\ln u)'=\frac{u'}u\)，\((\sin u)'=\cos u\cdot u'\)，\((a^u)'=a^u\ln a\cdot u'\)</p>
<p>多层：\(\frac{d}{dx}\cos^2(3x)=2\cos 3x\cdot(-\sin3x)\cdot3\)，一层一层剥。</p>
<p>化简：对 ln 先拆开，\(\ln\frac{x^2}{(x+1)^3}=2\ln x-3\ln(x+1)\)。</p>
</div></details>
<details open><summary>6 · 导数公式表（必背）</summary><div class="body">
<div class="grid2">
<div><h4>Trig</h4><p>\((\sin x)'=\cos x\)<br>\((\cos x)'=-\sin x\)<br>\((\tan x)'=\sec^2x\)<br>\((\cot x)'=-\csc^2x\)<br>\((\sec x)'=\sec x\tan x\)<br>\((\csc x)'=-\csc x\cot x\)</p><p class="scope">带 c 的都有负号</p></div>
<div><h4>Exp / Log</h4><p>\((e^x)'=e^x\)<br>\((a^x)'=a^x\ln a\)<br>\((\ln x)'=\frac1x\)<br>\((\log_ax)'=\frac{1}{x\ln a}\)<br>\((\ln|x|)'=\frac1x\)</p></div>
<div><h4>Inverse Trig</h4><p>\((\arcsin x)'=\frac{1}{\sqrt{1-x^2}}\)<br>\((\arccos x)'=-\frac{1}{\sqrt{1-x^2}}\)<br>\((\arctan x)'=\frac{1}{1+x^2}\)<br>\((\text{arccot}\,x)'=-\frac{1}{1+x^2}\)<br>\((\text{arcsec}\,x)'=\frac{1}{|x|\sqrt{x^2-1}}\)<br>\((\text{arccsc}\,x)'=-\frac{1}{|x|\sqrt{x^2-1}}\)</p></div>
</div></div></details>
<details open><summary>7 · 反函数求导（重点）</summary><div class="body">
<div class="eq">\((f^{-1})'(a)=\dfrac{1}{f'\big(f^{-1}(a)\big)}\)　即　\(\dfrac{dx}{dy}=\dfrac{1}{dy/dx}\)</div>
<p><b>三步法</b>（\(g=f^{-1}\)，求 \(g'(a)\)）：① 找 \(b\) 使 \(f(b)=a\)（解方程 / 在 \(f(x)\) 那一行找 / 看图找 \(y=a\)）② 算 \(f'(b)\) ③ \(g'(a)=\frac1{f'(b)}\)</p>
<ul>
<li>例 1：\(f(x)=x^3+x-2\)，\(f(1)=0\)，\(f'(1)=4\) ⇒ \(g'(0)=\frac14\)</li>
<li>例 2（表格）：\(f(3)=7,\ f'(3)=2\) ⇒ \((f^{-1})'(7)=\frac12\)。<mark>在 \(f(x)\) 那一行找 7</mark></li>
<li>例 3：\(h(g(x))=x\) ⇒ \(g\) 是 \(h\) 的反函数，两边求导 \(h'(g(x))g'(x)=1\)</li>
<li>例 4：\(f(x)=2x+\sin x\)，\(f(\pi)=2\pi\)，\(f'(\pi)=1\) ⇒ \((f^{-1})'(2\pi)=1\)</li>
</ul></div></details>
<details open><summary>8 · 隐函数求导</summary><div class="body">
<p>步骤：两边对 \(x\) 求导，含 \(y\) 的项每次乘 \(y'\) → 含 \(y'\) 的项移到一边 → 提出 \(y'\)。</p>
<p>\(\frac{d}{dx}y^3=3y^2y'\)，\(\frac{d}{dx}(xy)=y+xy'\)，\(\frac{d}{dx}\sin(xy)=\cos(xy)(y+xy')\)，\(\frac{d}{dx}e^y=e^yy'\)</p>
<p>例：\(x^2+xy-y^2=1\) 在 \((2,3)\)：\(y'=\frac{2x+y}{2y-x}=\frac74\)</p>
<p>二阶：\(x^2+y^2=25\Rightarrow y'=-\frac xy\Rightarrow y''=-\frac{y-xy'}{y^2}=-\frac{x^2+y^2}{y^3}=-\frac{25}{y^3}\)</p>
<ul>
<li>水平切线：\(y'\) 分子 = 0（分母 ≠ 0）；竖直切线：分母 = 0（分子 ≠ 0）。<mark>代回原方程验证</mark></li>
<li>求某点斜率时先代数再解 \(y'\)，更快</li>
</ul></div></details>
<details open><summary>9 · 切线与法线</summary><div class="body">
<ul>
<li>切线 \(y-y_1=m(x-x_1)\)，\(m=f'(x_1)\)；法线斜率 \(-\frac1m\)</li>
<li>切线水平 ⇒ 法线 \(x=x_1\)；切线竖直 ⇒ 法线 \(y=y_1\)</li>
<li>只给 \(x_1\) 时自己算 \(y_1=f(x_1)\)</li>
<li>平行于斜率 \(k\) 的直线 ⇒ \(f'(x)=k\)；垂直 ⇒ \(f'(x)=-\frac1k\)</li>
<li>线性近似 \(f(x)\approx f(a)+f'(a)(x-a)\)；AP 允许点斜式作答</li>
</ul></div></details>
<details><summary>10 · 表格题 &amp; 图像题</summary><div class="body">
<h4>表格题</h4>
<ul><li>先写符号公式再代数：\(h'(2)=f'(g(2))g'(2)=f'(3)\cdot g'(2)\)</li><li>复合函数先查内层 \(g(2)\)，再用它查外层 \(f'\)</li><li>估计 \(f''\) 用 \(f'\) 那行的差商</li></ul>
<h4>图像题</h4>
<ul><li>线段：斜率 \(\frac{\Delta y}{\Delta x}\)，折点不可导</li><li>半圆：切线 ⊥ 半径；最高最低点 \(f'=0\)；端点竖直切线</li><li>给的是 \(f'\) 的图时：纵坐标就是 \(f'\) 的值</li><li>\(f(f(x)),\ f(x^2),\ f(3x-1)\)：先算内层值，确认落在哪一段，再读斜率</li></ul>
</div></details>

<details open><summary>1 · 变量、表达式、类型转换</summary><div class="body">
<p class="note">结果类型由<b>当前这一步运算的操作数</b>决定，不由接收变量决定。这是 Unit 1 最常考的一条。</p>
<h4>类型</h4>
<div class="tbl"><table>
<tr><th>类型</th><th>分类</th><th>例子</th><th>要点</th></tr>
<tr><td><code>int</code></td><td>primitive</td><td>17</td><td>范围约 ±21 亿，超出会 overflow（不报错）</td></tr>
<tr><td><code>double</code></td><td>primitive</td><td>3.0</td><td>有舍入误差，<code>0.1+0.2 != 0.3</code></td></tr>
<tr><td><code>boolean</code></td><td>primitive</td><td>true</td><td>只有 true/false</td></tr>
<tr><td><code>String</code></td><td>reference</td><td>"Hi"</td><td>存的是对象的引用</td></tr>
</table></div>
<ul style="margin-top:8px"><li><code>final double TAX = 0.08;</code> 常量不能再赋值，否则编译错误。</li><li>局部变量未赋值就使用 → 编译错误；变量出了 <code>{ }</code> 就不可访问（scope）。</li></ul>
<h4>整数除法与 %</h4>
<div class="tbl"><table>
<tr><th>表达式</th><th>值</th></tr>
<tr><td><code>7 / 2</code></td><td>3</td></tr>
<tr><td><code>-7 / 2</code></td><td>-3（向零截断）</td></tr>
<tr><td><code>7 / 2.0</code></td><td>3.5</td></tr>
<tr><td><code>7 % 2</code> / <code>-7 % 2</code></td><td>1 / -1</td></tr>
<tr><td><code>double d = 9 / 4;</code></td><td><mark>2.0</mark>（先算 int 的 2）</td></tr>
<tr><td><code>int / 0</code></td><td>ArithmeticException（运行时错误）</td></tr>
</table></div>
<p style="margin-top:8px">优先级：括号 → 强制转换 / 一元 → <code>* / %</code> → <code>+ -</code>，同级从左到右。<code>1 + 5 % 3 = 3</code>。</p>
<h4>Casting</h4>
<ul><li>int → double 自动；double → int 必须写 <code>(int)</code>，向零截断：<code>(int) -5.99 = -5</code>。</li>
<li>位置决定结果：<code>(double) 10 / 3</code> ≈ 3.333；<code>(double) (10 / 3)</code> = 3.0。</li>
<li>四舍五入：正数 <code>(int)(x + 0.5)</code>，负数 <code>(int)(x - 0.5)</code>。</li></ul>
<h4>复合赋值与自增</h4>
<ul><li><code>x += e</code> 等于 <code>x = x + (e)</code>。<code>str += str + 0 + 8</code> → <code>"0" + "0" + 0 + 8 = "0008"</code>。</li>
<li><code>x++</code> 在表达式里先用旧值：<code>int y = x++;</code> 后 y 是旧值。</li></ul>
<h4>赋值按顺序执行：交换两个变量</h4>
<p>每条赋值用的是「此刻」的值，覆盖后旧值就没了。交换必须先存一份：</p>
<pre class="code">int temp = x;
x = y;
y = temp;   // x、y 互换</pre>
<ul><li>只写 <code>x = y; y = x;</code> → 两个都变成 y 的原值。</li>
<li>三行顺序不能乱：第二行必须覆盖那个已备份的变量（x）。</li>
<li>赋值方向固定为右 → 左：<code>pi * r * r = baseArea;</code> 是编译错误。</li></ul>
<h4>字符串拼接与输出</h4>
<div class="tbl"><table>
<tr><th>表达式</th><th>结果</th></tr>
<tr><td><code>1 + 2 + "Z"</code></td><td>"3Z"</td></tr>
<tr><td><code>"Z" + 1 + 2</code></td><td>"Z12"</td></tr>
<tr><td><code>"Z" + (1 + 2)</code></td><td>"Z3"</td></tr>
</table></div>
<ul style="margin-top:8px"><li>拼接不加空格。<code>print</code> 不换行，<code>println</code> 换行，<code>println()</code> 只换行。</li>
<li>转义：<code>\n</code> 换行、<code>\t</code> 制表、<code>\"</code> 双引号、<code>\\</code> 反斜杠。</li></ul>
<h4>三种错误</h4>
<div class="tbl"><table>
<tr><th>类型</th><th>例子</th></tr>
<tr><td>编译错误</td><td>少分号、类型不匹配、<code>int x = 2.5;</code>、<code>String s = voidMethod();</code>、<code>double other = null;</code>（基本类型不能是 null）</td></tr>
<tr><td>运行时错误</td><td>除以 0、对 null 调方法、substring 越界</td></tr>
<tr><td>逻辑错误</td><td>能运行但结果错，如 <code>if (x &gt; 0);</code> 多了分号</td></tr>
</table></div>
<ul style="margin-top:8px"><li>前置条件（precondition）题：找「刚好能避免问题」的条件。<code>5 / y</code> → <code>y != 0</code>；<code>x * x * y &gt; 0</code> → <code>x != 0</code> 且 <code>y &gt; 0</code>。</li>
<li>double 有舍入误差：<code>(a + b) * (a - b) != a * a - b * b</code> 可能为 true。</li></ul>
</div></details>

<details open><summary>2 · 对象与方法调用</summary><div class="body">
<p class="note">先看方法头：有没有 <code>static</code>、返回类型是什么、参数的数量 / 顺序 / 类型。调用题几乎都能靠这三点判断。</p>
<h4>类、属性、实例</h4>
<ul><li>类（class）是蓝图；属性（attribute）是类定义的数据项（color, year）；实例（instance）是 new 出来的具体对象（red, 2003, Ford）。</li>
<li><code>Triangle b = a;</code> 不复制对象，a、b 指向同一个对象（aliasing）。</li>
<li><code>Triangle t = null; t.perimeter();</code> → NullPointerException，这一行终止，后面都不执行。</li></ul>
<h4>构造器、private 与引用</h4>
<ul><li>创建对象必须用 new：<code>Player p = Player(true, 5);</code> 编译错误。</li>
<li>实参必须在数量、类型、顺序上匹配某个构造器：<code>new Student("Juan", "15")</code> 错（"15" 是 String），<code>new WindTurbine(3.25)</code> 错（double 不能传给 int）。</li>
<li>调用时只写值：<code>new Sample(10, 6.2)</code> 对，<code>new Sample(int x, double y)</code> 错。</li>
<li>private 属性类外不能直接访问：<code>obj.myA</code> 编译错误，要用 <code>obj.getA()</code>。</li>
<li><code>dog2 = dog1; dog1 = new Dog("Fido", 60);</code> → dog1 指向新对象，dog2 仍指向原来的 Rex。</li></ul>
<h4>static vs 实例方法</h4>
<div class="tbl"><table>
<tr><th></th><th>类方法 (static)</th><th>实例方法</th></tr>
<tr><td>方法头</td><td>有 static</td><td>没有 static</td></tr>
<tr><td>调用</td><td><code>ClassName.method()</code></td><td><code>obj.method()</code></td></tr>
<tr><td>例子</td><td><code>Math.sqrt(16.0)</code></td><td><code>c.getArea()</code>、<code>s.length()</code></td></tr>
</table></div>
<p style="margin-top:8px"><code>Purchase.totalAmount();</code> → 错，实例方法不能用类名调用。</p>
<h4>void vs 有返回值</h4>
<ul><li>void 方法只能单独成一句 <code>p.totalAmount();</code>。<code>String s = voidMethod();</code> 和 <code>println(voidMethod())</code> 都是编译错误。</li>
<li>「打印」≠「返回」。题干说 displays / prints → 直接调用；说 returns → 用变量接住或放进 print。</li>
<li>有返回值的方法单独调用也合法，只是返回值被丢弃。</li></ul>
<h4>参数与重载</h4>
<ul><li>基本类型按值传递：方法里改形参，调用者的变量不变。</li>
<li>签名 = 方法名 + 参数类型列表。只改返回类型或参数名不算重载。</li>
<li><code>double x = m(2, false)</code> 合法；<code>m(2.5, false)</code> 错（double 不会自动变 int）；返回 double 的方法不能直接赋给 int。</li></ul>
<h4>Math 类</h4>
<div class="tbl"><table>
<tr><th>方法</th><th>返回</th><th>例子</th></tr>
<tr><td><code>Math.abs(x)</code></td><td>与 x 同类型</td><td><code>Math.abs(-5) = 5</code></td></tr>
<tr><td><code>Math.pow(a, b)</code></td><td>double</td><td><code>Math.pow(2, 3) = 8.0</code></td></tr>
<tr><td><code>Math.sqrt(x)</code></td><td>double</td><td><code>Math.sqrt(9) = 3.0</code></td></tr>
<tr><td><code>Math.random()</code></td><td>double，[0.0, 1.0)</td><td>—</td></tr>
</table></div>
<p style="margin-top:8px">随机整数 [min, max]：<code>(int) (Math.random() * (max - min + 1)) + min</code>。先乘再转；<code>(int) Math.random() * 6 + 1</code> 永远是 1。</p>
</div></details>

<details open><summary>3 · String 方法</summary><div class="body">
<p>下标从 0 开始，最后一个是 <code>length() - 1</code>；substring <mark>左闭右开</mark>。以 <code>String s = "Java";</code> 为例（J=0, a=1, v=2, a=3）：</p>
<div class="tbl"><table>
<tr><th>调用</th><th>结果</th><th>说明</th></tr>
<tr><td><code>s.length()</code></td><td>4</td><td></td></tr>
<tr><td><code>s.substring(1, 3)</code></td><td>"av"</td><td>[1, 3)</td></tr>
<tr><td><code>s.substring(2)</code></td><td>"va"</td><td>到末尾</td></tr>
<tr><td><code>s.substring(4)</code></td><td>""</td><td>等于 length 合法，得空串</td></tr>
<tr><td><code>s.substring(1, 5)</code></td><td>异常</td><td>StringIndexOutOfBoundsException</td></tr>
<tr><td><code>s.indexOf("a")</code></td><td>1</td><td>第一次出现</td></tr>
<tr><td><code>s.indexOf("a", 2)</code></td><td>3</td><td>从下标 2 开始找</td></tr>
<tr><td><code>s.indexOf("x")</code></td><td>-1</td><td>找不到</td></tr>
<tr><td><code>s.equals("java")</code></td><td>false</td><td>区分大小写</td></tr>
<tr><td><code>s.compareTo("Jb")</code></td><td>负数</td><td>s 字典序在前 → 负；相等 → 0</td></tr>
</table></div>
<ul style="margin-top:8px"><li>取第 i 个字符（作为 String）：<code>s.substring(i, i + 1)</code>。</li>
<li>不可变：<code>s.toUpperCase();</code> 不改 s，要写 <code>s = s.toUpperCase();</code>。</li>
<li>比内容用 <code>.equals()</code>；<code>==</code> 比是否同一对象，也用来和 null 比。</li>
<li><code>""</code> 有对象，length() = 0；<code>null</code> 没有对象，调方法就抛异常。</li>
<li>对象和 String 拼接会自动调用 toString()；没重写时输出类似 <code>Car@4617c264</code>。</li>
<li>窗口扫描：条件写 <code>k + len &lt;= str.length()</code>。每次匹配都覆盖 <code>num = k</code> → 得到<b>最后一次</b>出现；要第一次就立刻 <code>return k</code>。</li></ul>
</div></details>

<details open><summary>4 · Boolean 与 Selection</summary><div class="body">
<p class="note">一串独立的 if 和一条 if / else if 链行为不同；但只要前面的分支 return 了，后面的就不会执行。先判断执行顺序，再算值。</p>
<h4>运算符优先级（高 → 低）</h4>
<div class="chips"><span class="chip">! 、强制转换</span><span class="chip">* / %</span><span class="chip">+ -</span><span class="chip">&lt; &lt;= &gt; &gt;=</span><span class="chip">== !=</span><span class="chip">&amp;&amp;</span><span class="chip">||</span></div>
<p style="margin-top:8px">所以 <code>a || b &amp;&amp; c</code> = <code>a || (b &amp;&amp; c)</code>。</p>
<h4>短路求值</h4>
<ul><li><code>A &amp;&amp; B</code>：A 为 false → 不算 B。<code>A || B</code>：A 为 true → 不算 B。</li>
<li><code>if (x != 0 &amp;&amp; 10 / x &gt; 2)</code>、<code>if (s != null &amp;&amp; s.length() &gt; 0)</code> 不会报错；顺序反过来就会异常。</li></ul>
<h4>De Morgan</h4>
<div class="eq">!(a &amp;&amp; b) ≡ !a || !b　　　!(a || b) ≡ !a &amp;&amp; !b</div>
<p>取反比较符：<code>&lt;</code> ↔ <code>&gt;=</code>，<code>&gt;</code> ↔ <code>&lt;=</code>，<code>==</code> ↔ <code>!=</code>。例：<code>!(x &lt; 0 || x &gt; 2)</code> ≡ <code>x &gt;= 0 &amp;&amp; x &lt;= 2</code>。</p>
<h4>if 的三种形态</h4>
<div class="tbl"><table>
<tr><th>写法</th><th>会执行几个分支</th></tr>
<tr><td>多个独立 if</td><td>0 到全部，每个都检查</td></tr>
<tr><td>if / else if / else</td><td>恰好 1 个，第一个为 true 的胜出</td></tr>
<tr><td>if / else if（无 else）</td><td>0 或 1 个</td></tr>
</table></div>
<ul style="margin-top:8px"><li>条件顺序很重要：<code>if (x &lt; 10)</code> 写在 <code>if (x &lt; 5)</code> 前面并 return，后者永远轮不到。</li>
<li>Dangling else：没有 <code>{ }</code> 时，else 配最近的未配对 if，缩进不算数。</li>
<li>没有 <code>{ }</code> 时，if 只管紧跟的一条语句。</li>
<li><code>if (cond);</code> → 分号是空分支体，下面的块无条件执行。</li></ul>
<h4>College Board 常见变形</h4>
<ul><li>独立 if 会覆盖：<code>if (grade &gt; 89) p = 4.0; if (grade &gt; 79) p = 3.0; ...</code> 对 95 最终得 3.0。改成 else-if 链才对。</li>
<li>两个 boolean 可以用 <code>==</code> / <code>!=</code> 比较：<code>(x &gt; y) == (y &gt; z)</code> 表示 y 在 x 和 z 之间。</li>
<li>按优先级算字面量：<code>false &amp;&amp; true || false</code> = false。</li>
<li>选「哪个输入会出错」时用边界值试：闰年题里 1900 是 4 的倍数但不是闰年。</li>
<li>先乘折扣再加固定费用：只对该打折的部分 <code>*= 0.9</code>，不打折的放在 if 外面。</li></ul>
<h4>嵌套 if 等价题：列情况表</h4>
<div class="tbl"><table>
<tr><th>length &gt; 5</th><th>含 A</th><th>含 B</th><th>result</th></tr>
<tr><td>是</td><td>否</td><td>—</td><td>1</td></tr>
<tr><td>是</td><td>是</td><td>否</td><td>2</td></tr>
<tr><td>是</td><td>是</td><td>是</td><td>0</td></tr>
<tr><td>否</td><td>否</td><td>—</td><td>3</td></tr>
<tr><td>否</td><td>是</td><td>—</td><td>0</td></tr>
</table></div>
<p style="margin-top:8px">用这 5 行逐个核对选项，不要靠「看起来像」。</p>
</div></details>

<details open><summary>5 · While 循环</summary><div class="body">
<p class="note">AP 很少让你从零写循环，考的是追踪：输出什么、循环体执行几次、改一行会怎样。</p>
<ul><li>四部分：init → condition（每次进入前检查，包括第一次）→ body → update。</li>
<li>条件一开始就 false → 0 次。<mark>条件检查次数 = 循环体次数 + 1</mark>。</li></ul>
<h4>追踪表：每次检查条件写一行</h4>
<pre class="code">int i = 3;
while (i &lt; 12) {
    System.out.print(i + " ");
    i += 4;
}</pre>
<div class="tbl" style="max-width:420px"><table>
<tr><th>检查</th><th>i</th><th>i &lt; 12</th><th>输出</th></tr>
<tr><td>1</td><td>3</td><td>true</td><td>3</td></tr>
<tr><td>2</td><td>7</td><td>true</td><td>7</td></tr>
<tr><td>3</td><td>11</td><td>true</td><td>11</td></tr>
<tr><td>4</td><td>15</td><td>false</td><td>停</td></tr>
</table></div>
<p style="margin-top:8px">输出 <code>3 7 11</code>，循环体 3 次；循环后 i = 15。</p>
<h4>三种坏循环</h4>
<div class="tbl"><table>
<tr><th>问题</th><th>代码</th><th>后果</th></tr>
<tr><td>忘了 update</td><td><code>while (i &lt;= 5) { print(i); }</code></td><td>无限循环</td></tr>
<tr><td>条件后多分号</td><td><code>while (i &lt;= 100);</code></td><td>无限循环且无输出</td></tr>
<tr><td>条件写反</td><td><code>int i = 1; while (i &gt;= 5)</code></td><td>0 次，无提示</td></tr>
</table></div>
<h4>必会模式</h4>
<ul><li>累加器在循环外声明：和与计数从 0 开始，乘积从 1 开始。</li>
<li>平均值要除以 double：<code>sum / 100.0</code>。</li>
<li>数位拆分：<code>num % 10</code> 取个位，<code>num / 10</code> 去个位，条件 <code>num != 0</code>。<code>num &gt;= 0</code> 会无限循环。</li>
<li><code>while (n * n &lt; 1000) n++;</code> 结束时 n = 32。</li>
<li><code>n = 10; while (n &gt; 0) n = n / 2;</code> → 10→5→2→1→0，4 次。</li>
<li>双指针（回文）：<code>while (left &lt; right)</code>，用 &lt; 不用 !=。</li></ul>
<h4>College Board 常见变形</h4>
<ul><li>先 update 还是先 print：<code>num = 10; while (num &gt; 1) { num--; print(num); }</code> 打印 987654321；两行对调变成 1098765432。只看第一次和最后一次打印什么。</li>
<li>哨兵循环（读到负数就停）：「读入 → 累乘」都在循环体里时，最后那个负数也会被乘进去。</li>
<li>循环后的语句也要算：<code>count = 5; while (count &lt; 100) count *= 2; count += 1;</code> → 161。</li>
<li>变量卡住不动：numOne = 128, numTwo = 4：128→32→8→2，2 % 4 != 0 不再更新，而 2 &gt; 1 一直 true → 无限循环。</li>
<li>条件是 != 时想想会不会跳过。</li>
<li><code>while (value % 5 == 0) value /= 2;</code> 从 100 → 50 → 25 → 12，停。</li></ul>
<h4>While + String（Lab 12）不重叠计数</h4>
<pre class="code">int count = 0, i = 0;
while (i &lt;= s.length() - target.length()) {
    if (s.substring(i, i + target.length()).equals(target)) {
        count++;
        i += target.length();
    } else {
        i++;
    }
}</pre>
<ul><li>("aaaa", "aa") → 2；("banana", "ana") → 1。</li>
<li>条件必须是 <code>&lt;=</code>；写成 <code>&lt;</code> 会漏掉最后一个窗口。</li>
<li>另一种写法：<code>index = s.indexOf(target); while (index != -1) { count++; index = s.indexOf(target, index + target.length()); }</code></li>
<li><code>i &lt;= s.length()</code> 配 <code>substring(i, i + 1)</code> → StringIndexOutOfBoundsException。</li></ul>
</div></details>`,

 <div class="tabs" role="tablist">${S.tabs.map(t=>`<button class="tab" role="tab" data-tab="${t.k}" aria-selected="${t.k===tab}">${t.l}${t.quiz?`<span class="n">${t.quiz.length}</span>`:""}${t.mcq?`<span class="n">${t.mcq.length}</span>`:""}</button>`).join("")}</div>
 <section class="panel" id="panel"></section>`;
 renderPanel(tab);
}
function curTab(){const S=SUBJ[cur];const k=store.get("tab:"+cur,S.tabs[0].k);return S.tabs.find(t=>t.k===k)||S.tabs[0]}
function renderPanel(k){
 const el=document.getElementById("panel");const t=SUBJ[cur].tabs.find(x=>x.k===k);
 if(t.html!=null)el.innerHTML=t.html;
 else if(t.quiz)renderQuiz(el,t);
 else if(t.plan)renderPlan(el,t);
 else if(t.mcq)renderMCQ(el,t);
 else if(t.frq)renderFRQ(el,t);
 typeset(el);
}
function updBar(){const b=document.querySelector(".progress i");if(b){const p=progress(cur);b.style.width=(p.tot?p.done/p.tot*100:0)+"%"}}

/* self-test */
function renderQuiz(el,t){
 const st=store.get(cur+":quiz",{}),shown=store.get(cur+":shown",{});
 const ok=Object.values(st).filter(v=>v==="ok").length,no=Object.values(st).filter(v=>v==="no").length;
 el.innerHTML=`<div class="qhead"><div class="score">会 ${ok} · 不会 ${no} · 未标 ${t.quiz.length-ok-no}</div>
 <div class="chips"><button class="btn" id="q-showall">全部显示答案</button><button class="btn" id="q-hideall">全部遮住</button><button class="btn" id="q-onlyno">${onlyNo?"显示全部":"只看不会的"}</button><button class="btn" id="q-reset">清除标记</button></div></div>
 <p class="scope" style="margin:0">${t.sub||""}</p>
 <div class="qlist">${t.quiz.map(([q,a],i)=>{const s=st[i]||"";if(onlyNo&&s!=="no")return"";return `<div class="q ${s}" data-i="${i}">
 <div class="num">${i+1}</div><div>${q}</div>
 ${shown[i]?`<div class="ans">${a}</div>`:""}
 <div class="ctl"><button class="btn" data-act="show">${shown[i]?"遮住答案":"看答案"}</button>
 <button class="btn okb" data-act="ok" aria-pressed="${s==="ok"}">会</button><button class="btn nob" data-act="no" aria-pressed="${s==="no"}">不会</button></div></div>`}).join("")}</div>`;
}
/* plan */
function renderPlan(el,t){
 const st=store.get(cur+":plan",{});
 el.innerHTML=`<div class="grid2">${t.plan.map((d,di)=>`<div class="day"><h4>${d.day}${d.today?'<span class="today">今天</span>':""}</h4>
 ${d.items.map(([x,m],ii)=>{const k=di+"-"+ii;return `<div class="check"><input type="checkbox" id="${cur}-plan-${k}" data-k="${k}" ${st[k]?"checked":""}><label for="${cur}-plan-${k}">${x}${m?`<span class="t">${m}</span>`:""}</label></div>`}).join("")}</div>`).join("")}</div>
 ${t.foot?`<p class="note">${t.foot}</p>`:""}`;
}
/* mock MCQ */
const LET="ABCDE";let timerInt=null;
function mcqState(){return store.get(cur+":mcq",{a:{},submitted:false,used:0,run:null})}
function mcqElapsed(m){return m.used+(m.run?Date.now()-m.run:0)}
function fmtClock(ms){const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderMCQ(el,t){
 const m=mcqState();const n=t.mcq.length;
 const answered=Object.keys(m.a).length;
 const correct=t.mcq.filter((q,i)=>m.a[i]===q[2]).length;
 const wrong=t.mcq.map((q,i)=>m.a[i]!==q[2]?i+1:null).filter(Boolean);
 el.innerHTML=`<div class="mockbar">
  <div><div class="clock" id="clock">${fmtClock(55*6e4-mcqElapsed(m))}</div><div class="scope" style="margin:0">建议 55 分钟 · 不用计算器</div></div>
  ${m.submitted?`<div class="result"><b>${correct} / ${n}</b>${wrong.length?`错题：${wrong.join("、")}`:"全对"}<br><span class="scope">目标：错 ≤ 4 题</span></div>`:`<div class="scope" style="margin:0">已作答 ${answered} / ${n}</div>`}
  <div class="chips">${m.submitted?"":`<button class="btn" id="m-timer">${m.run?"暂停计时":(m.used?"继续计时":"开始计时")}</button><button class="btn" id="m-submit">交卷</button>`}<button class="btn" id="m-reset">重做</button></div>
 </div>
 <div class="qlist">${t.mcq.map(([stem,opts,ans,sol],i)=>{
  const pick=m.a[i];const cls=m.submitted?(pick===ans?"ok":"no"):"";
  return `<div class="q mq ${cls}" data-i="${i}"><div class="num">${i+1}</div><div class="stem">${stem}</div>
  <div class="opts">${opts.map((o,j)=>{let c="opt";if(pick===j)c+=" sel";if(m.submitted&&j===ans)c+=" right";if(m.submitted&&pick===j&&j!==ans)c+=" wrong";
   return `<button class="${c}" data-j="${j}" ${m.submitted?"disabled":""}><span class="let">${LET[j]}</span><span>${o}</span></button>`}).join("")}</div>
  ${m.submitted?`<div class="ans"><b>答案 ${LET[ans]}</b>${pick==null?"（未作答）":""}　${sol}</div>`:""}</div>`}).join("")}</div>`;
 clearInterval(timerInt);
 if(m.run&&!m.submitted)timerInt=setInterval(()=>{const c=document.getElementById("clock");if(!c){clearInterval(timerInt);return}const left=55*6e4-mcqElapsed(mcqState());c.textContent=left>0?fmtClock(left):"时间到";c.classList.toggle("over",left<=0)},1000);
}
/* mock FRQ */
function renderFRQ(el,t){
 const st=store.get(cur+":frq",{});
 el.innerHTML=`<p class="scope" style="margin:0">建议 50 分钟。每小问先在纸上写完整过程（公式 → 代数 → 结果），再点开解答对照。</p>
 ${t.frq.map((f,fi)=>`<div class="frq"><h3>${f.title}</h3>${f.stem}
 <div class="qlist">${f.parts.map(([q,a],pi)=>{const k=fi+"-"+pi;return `<div class="q" data-k="${k}"><div class="num">(${"abcdef"[pi]})</div><div>${q}</div>
 ${st[k]?`<div class="ans">${a}</div>`:""}<div class="ctl"><button class="btn" data-frq="${k}">${st[k]?"收起解答":"看解答"}</button></div></div>`}).join("")}</div></div>`).join("")}
 <p class="note">评分参考：选择 28 题 × 1 分；FRQ 每题约 9 分（每小问 1–2 分）。</p>`;
}

document.addEventListener("click",ev=>{
 const s=ev.target.closest(".subj");if(s){cur=s.dataset.id;store.set("cur",cur);location.hash=cur;render();window.scrollTo(0,0);return}
 const t=ev.target.closest(".tab");if(t){store.set("tab:"+cur,t.dataset.tab);document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b===t));renderPanel(t.dataset.tab);return}
 const el=document.getElementById("panel");if(!el)return;const T=curTab();
 /* MCQ option: toggle classes only, no re-render */
 const o=ev.target.closest(".opt");
 if(o&&!o.disabled){const q=o.closest(".mq"),i=q.dataset.i,j=+o.dataset.j;const m=mcqState();m.a[i]=j;store.set(cur+":mcq",m);
  q.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",+b.dataset.j===j));
  const sc=el.querySelector(".mockbar .scope:not(.clock)");return}
 const fb=ev.target.closest("[data-frq]");
 if(fb){const st=store.get(cur+":frq",{});st[fb.dataset.frq]=!st[fb.dataset.frq];store.set(cur+":frq",st);const y=window.scrollY;renderFRQ(el,T);typeset(el);window.scrollTo(0,y);updBar();return}
 const qb=ev.target.closest(".q:not(.mq) button[data-act]");
 if(qb){const i=qb.closest(".q").dataset.i,act=qb.dataset.act;
  if(act==="show"){const sh=store.get(cur+":shown",{});sh[i]=!sh[i];store.set(cur+":shown",sh)}
  else{const st=store.get(cur+":quiz",{});st[i]=st[i]===act?"":act;store.set(cur+":quiz",st);updBar()}
  renderQuiz(el,T);typeset(el);return}
 const id=ev.target.id;
 if(id==="q-showall"||id==="q-hideall"){const sh={};if(id==="q-showall")T.quiz.forEach((_,i)=>sh[i]=true);store.set(cur+":shown",sh);renderQuiz(el,T);typeset(el)}
 if(id==="q-onlyno"){onlyNo=!onlyNo;renderQuiz(el,T);typeset(el)}
 if(id==="q-reset"){store.set(cur+":quiz",{});store.set(cur+":shown",{});onlyNo=false;renderQuiz(el,T);updBar()}
 if(id==="m-timer"){const m=mcqState();if(m.run){m.used+=Date.now()-m.run;m.run=null}else m.run=Date.now();store.set(cur+":mcq",m);renderMCQ(el,T);typeset(el)}
 if(id==="m-submit"){const m=mcqState();if(m.run){m.used+=Date.now()-m.run;m.run=null}m.submitted=true;store.set(cur+":mcq",m);renderMCQ(el,T);typeset(el);updBar();window.scrollTo(0,el.offsetTop-80)}
 if(id==="m-reset"){if(ev.target.dataset.confirm!=="1"){ev.target.dataset.confirm="1";ev.target.textContent="确定清空？再点一次";return}
  store.set(cur+":mcq",{a:{},submitted:false,used:0,run:null});renderMCQ(el,T);typeset(el);updBar()}
});
document.addEventListener("change",ev=>{const k=ev.target.dataset?.k;if(k==null)return;const st=store.get(cur+":plan",{});st[k]=ev.target.checked;store.set(cur+":plan",st);updBar()});

function tick(){
 const now=Date.now();const n=EXAMS.find(e=>new Date(e.start).getTime()+90*6e4>now);
 document.getElementById("next").innerHTML=n?`下一场 · ${n.short} · ${fmtDate(n).split(" ").slice(0,3).join(" ")}<b>${left(new Date(n.start)-now)}</b>`:"<b>期中结束</b>";
}
function fromHash(){const h=location.hash.slice(1);if(EXAMS.some(e=>e.id===h)){cur=h;return true}return false}
if(!fromHash())cur=store.get("cur","chem");
if(!EXAMS.some(e=>e.id===cur))cur="chem";
render();tick();setInterval(tick,30000);
window.addEventListener("hashchange",()=>{if(fromHash())render()});
</script>
